    <meta name="theme-color" content="#F4EFE6" />
    <!--
      Pre-paint: apply the stored mode and accent before the first frame, so a
      visitor who chose dark does not see a cream flash while React boots.
      Keys and allowed values mirror src/contexts/ThemeContext.jsx.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var mode = localStorage.getItem('eddie-portfolio-mode');
          var theme = localStorage.getItem('eddie-portfolio-theme');
          root.setAttribute('data-mode', mode === 'dark' ? 'dark' : 'light');
          root.setAttribute(
            'data-theme',
            /^(terracota|azul|bosque|tinta)$/.test(theme) ? theme : 'terracota'
          );
          if (mode === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#06060a');
          }
        } catch (e) {
          root.setAttribute('data-mode', 'light');
          root.setAttribute('data-theme', 'terracota');
        }
      })();
    </script>
